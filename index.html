<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated SVG Schematic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            background: #0D0D0D;
            border-radius: 2rem;
            padding: 2rem 1rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
            max-width: 1032px;
            margin: 0 auto;
            filter: drop-shadow(0 0 15px rgba(0,255,255,0.3));
        }
        /* simple keyframes for path animations */
        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }
        @keyframes pulseGlow {
            0% { stroke-opacity: 0.6; stroke-width: 0.5; }
            50% { stroke-opacity: 1; stroke-width: 1; filter: drop-shadow(0 0 6px cyan); }
            100% { stroke-opacity: 0.6; stroke-width: 0.5; }
        }
        @keyframes rotateCircle {
            from { transform: rotate(0deg); transform-origin: 587.775px 116.776px; }
            to { transform: rotate(360deg); transform-origin: 587.775px 116.776px; }
        }
        @keyframes arrowMove {
            0% { transform: translateX(0); opacity: 0.8; }
            50% { transform: translateX(8px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0.8; }
        }
        svg * {
            transition: all 0.2s ease;
        }
        /* Apply animations via CSS — but we'll also set stroke-dasharray in JS for paths */
    </style>
</head>
